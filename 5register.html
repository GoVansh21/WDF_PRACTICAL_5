<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration - Kaffee Coffee Cafe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<style>
    .registration {
    max-width: 550px;
    margin: 40px auto;
    padding: 30px;
    background-color: #fffaf2;
    color: #3b241b;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

.registration h2 {
    text-align: center;
    margin-bottom: 10px;
}

.registration > p {
    text-align: center;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group > label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input:not([type="radio"]):not([type="checkbox"]),
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #b9a18a;
    border-radius: 6px;
    font-size: 15px;
    box-sizing: border-box;
}

.form-group input:focus,
.form-group select:focus {
    outline: 2px solid #9b6844;
    border-color: #9b6844;
}

.gender-options {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.gender-options label {
    display: flex;
    align-items: center;
    gap: 5px;
}

.terms {
    display: flex;
    align-items: center;
    gap: 8px;
}

.error {
    display: block;
    color: #c62828;
    font-size: 13px;
    margin-top: 5px;
}

.success {
    color: #267a35;
    text-align: center;
    font-weight: bold;
    margin-top: 15px;
}

.register-btn {
    width: 100%;
    padding: 13px;
    background-color: #3b241b;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.register-btn:hover {
    background-color: #70452e;
}

/* MOBILE RESPONSIVE */

@media (max-width: 600px) {

    .registration {
        margin: 20px 12px;
        padding: 20px;
    }

    .gender-options {
        gap: 12px;
    }
}

/* DARK MODE SUPPORT */

body.dark-mode .registration {
    background-color: #302720;
    color: white;
}

body.dark-mode .registration input,
body.dark-mode .registration select {
    background-color: #f5ebdd;
    color: #3b241b;
}
</style>
    <!-- HEADER -->
    <header>
        <h1>Kaffee Coffee Cafe</h1>
        <p>Fresh Coffee, Fresh Moments</p>
    </header>

    <!-- NAVIGATION -->
    <nav>
        <a href="5index.html">Home</a>
        <a href="5about.html">About</a>
        <a href="5menu.html">Menu</a>
        <a href="5login.html">Login</a>
        <a href="5register.html">Register</a>
        <a href="5contact.html">Contact</a>
    </nav>


    <!-- REGISTRATION FORM -->
    <main>

        <section class="registration">

            <h2>Student Registration Form</h2>

            <p>Register with Kaffee Coffee Cafe</p>

            <form id="registrationForm" novalidate>

                <!-- NAME -->
                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                    <small id="nameError" class="error"></small>

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <small id="emailError" class="error"></small>

                </div>


                <!-- MOBILE -->
                <div class="form-group">

                    <label for="mobile">Mobile Number</label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter 10 digit mobile number"
                        maxlength="10"
                    >

                    <small id="mobileError" class="error"></small>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                    >

                    <small id="passwordError" class="error"></small>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                    >

                    <small id="confirmPasswordError" class="error"></small>

                </div>


                <!-- COURSE -->
                <div class="form-group">

                    <label for="course">Select Course</label>

                    <select id="course">

                        <option value="">-- Select Course --</option>

                        <option value="BCA">BCA</option>

                        <option value="BSc">B.Sc</option>

                        <option value="BTech">B.Tech</option>

                        <option value="MCA">MCA</option>

                        <option value="MBA">MBA</option>

                        <option value="Other">Other</option>

                    </select>

                    <small id="courseError" class="error"></small>

                </div>


                <!-- YEAR -->
                <div class="form-group">

                    <label for="year">Select Year</label>

                    <select id="year">

                        <option value="">-- Select Year --</option>

                        <option value="1">First Year</option>

                        <option value="2">Second Year</option>

                        <option value="3">Third Year</option>

                        <option value="4">Fourth Year</option>

                    </select>

                    <small id="yearError" class="error"></small>

                </div>


                <!-- GENDER -->
                <div class="form-group">

                    <label>Gender</label>

                    <div class="gender-options">

                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>

                    </div>

                    <small id="genderError" class="error"></small>

                </div>


                <!-- TERMS -->
                <div class="form-group">

                    <label class="terms">

                        <input type="checkbox" id="terms">

                        I accept the Terms and Conditions.

                    </label>

                    <small id="termsError" class="error"></small>

                </div>


                <!-- SUBMIT -->
                <button type="submit" class="register-btn">
                    Register Now
                </button>

                <p id="successMessage" class="success"></p>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            &copy; 2026 Kaffee Coffee Cafe.
            All Rights Reserved.
        </p>

        <a href="5contact.html">Contact Us</a>

    </footer>


    <script src="register.js" defer></script>

</body>
</html>
